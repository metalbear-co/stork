[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]

[licenses.private]
# The unpublished test fixture crates carry no license.
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
