name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same toolchain mirrord builds this crate with (`PINNED_NIGHTLY` there).
  RUST_TOOLCHAIN: nightly-2026-08-13
  # Real-target tests must run, not skip, when a tool is missing.
  STORK_REQUIRE_TOOLS: "1"

jobs:
  windows:
    # The same runner as mirrord's Windows tests: Windows Server 2025, build 26100.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify the runner is a tested build
        shell: pwsh
        run: |
          # The startup exception, and the tests that exercise it, need a tested build.
          $build = [Environment]::OSVersion.Version.Build
          Write-Host "Windows build $build"
          if ($build -notin 26100, 26200) {
            throw "Windows build $build is outside the tested startup builds"
          }
      - uses: metalbear-co/setup-rust-toolchain@a8d42d5aa259519dac1faeee20e37c1fb43453a3
        with:
          cache: false
          components: rustfmt, clippy
          target: x86_64-pc-windows-msvc
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
      - name: Format, build, lint, document, and test
        shell: pwsh
        run: ./test-support/check.ps1
      - name: Check dependency advisories, licenses, and sources
        shell: pwsh
        run: ./test-support/dependencies.ps1
