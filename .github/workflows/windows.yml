name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted runner label to run the suite on"
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - windows-2022

permissions:
  contents: read

env:
  # The same toolchain mirrord builds this crate with (`PINNED_NIGHTLY` there).
  RUST_TOOLCHAIN: nightly-2026-08-13
  # Real-target tests must run, not skip, when a tool is missing.
  STORK_REQUIRE_TOOLS: "1"

jobs:
  windows:
    # Defaults to windows-latest (the runner mirrord's Windows tests use, currently
    # Windows Server 2025, build 26100). A workflow_dispatch run can select
    # windows-2022 to exercise the suite on an older Windows build.
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Report the runner Windows build
        shell: pwsh
        run: |
          # The startup exception now applies on every Windows version; this is
          # informational only and no longer gates the run.
          Write-Host "Windows build $([Environment]::OSVersion.Version.Build)"
      - uses: metalbear-co/setup-rust-toolchain@a8d42d5aa259519dac1faeee20e37c1fb43453a3
        with:
          cache: false
          components: rustfmt, clippy
          # The compile_fail doctests print expected errors that the matcher
          # would otherwise annotate as failures on a passing run.
          matcher: false
          target: x86_64-pc-windows-msvc
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
      - name: Format, build, lint, document, and test
        shell: pwsh
        run: ./test-support/check.ps1
      - name: Check dependency advisories, licenses, and sources
        shell: pwsh
        run: ./test-support/dependencies.ps1
